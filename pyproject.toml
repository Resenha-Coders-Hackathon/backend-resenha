[project]
name = "sistema-autenticacao-django-rest"
version = "0.1.0"
description = ""
authors = [
  { name = "Ian Matheus Veiga", email = "ianmatheusv54@gmail.com" },
]
dependencies = [
  "django>=6.1",
  "djangorestframework>=3.17.2",
  "drf-spectacular>=0.30.0",
  "python-dotenv>=1.2.2",
  "djangorestframework-simplejwt>=5.5.1",
  "django-user-agents>=0.4.0",
  "django-cors-headers>=4.9.0",
  "django-auditlog>=3.4.1",
  "google-genai>=2.32.0",
  "cloudinary>=1.46.3",
  "pandas>=3.0.6",
  "scikit-learn>=1.9.1",
  "opencv-python-headless>=5.0.0.93",
  "psycopg[binary]>=3.3.6",
  "gunicorn>=26.2.0",
  "whitenoise>=6.12.0",
  "cryptography>=50.0.2",
  "google-auth[requests]>=2.62.0",
]
requires-python = ">=3.14"
readme = "README.md"
license = { text = "MIT" }

[dependency-groups]
dev = [
  "pre-commit>=4.6.2",
  "pyright>=1.1.411",
  "ruff>=0.16.2",
]
lint = [
  "ruff>=0.16.2",
]
types = [
  "django-stubs>=6.0.9",
  "pyright>=1.1.411",
]

[build-system]
requires = [
  "pdm-backend",
]
build-backend = "pdm.backend"

[tool.pdm]
distribution = false

[tool.pdm.scripts]
dev = "pdm run manage.py runserver"

[tool.pyright]
exclude = [
  "**/__pycache__",
  "**/.venv",
  "**/migrations",
]
pythonVersion = "3.14"
typeCheckingMode = "basic"

[tool.ruff]
exclude = [
  "migrations",
]
lint.select = [
  "F",
  "DJ",
  "I",
]
