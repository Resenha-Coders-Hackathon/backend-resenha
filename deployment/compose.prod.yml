name: resenha-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: resenha-backend:prod
    build:
      context: ./backend-resenha
      dockerfile: ../deploy/backend.Dockerfile
    restart: unless-stopped
    env_file: ./backend-resenha/.env
    secrets:
      - firebase_admin
    environment: &backend_environment
      DJANGO_SETTINGS_MODULE: app.settings.prod
      SECRET_KEY: ${DJANGO_PROD_SECRET_KEY:?Set DJANGO_PROD_SECRET_KEY in .env.prod}
      ALLOWED_HOSTS: 3009.michalski.app,4000.michalski.app
      CSRF_TRUSTED_ORIGINS: https://4000.michalski.app
      FRONTEND_URL: https://4000.michalski.app
      USE_HTTPS: "True"
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      FIREBASE_CREDENTIALS: /run/secrets/firebase_admin
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://localhost:8000/api/docs/urls/', headers={'Host':'4000.michalski.app','X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 60s
      retries: 10

  worker:
    image: resenha-backend:prod
    restart: unless-stopped
    env_file: ./backend-resenha/.env
    secrets:
      - firebase_admin
    environment: *backend_environment
    command: ["celery", "-A", "app", "worker", "--loglevel=info", "--concurrency=2"]
    volumes:
      - media_data:/app/media
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-resenha
      dockerfile: ../deploy/frontend.Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_PUBLIC_MP_KEY: ${VITE_PUBLIC_MP_KEY:-}
        VITE_MAPBOX_API_KEY: ${VITE_MAPBOX_API_KEY:-}
        VITE_API_KEY: ${VITE_API_KEY:-}
        VITE_AUTH_DOMAIN: ${VITE_AUTH_DOMAIN:-}
        VITE_PROJECT_ID: ${VITE_PROJECT_ID:-}
        VITE_STORAGE_BUCKET: ${VITE_STORAGE_BUCKET:-}
        VITE_MESSAGING_SENDER_ID: ${VITE_MESSAGING_SENDER_ID:-}
        VITE_APP_ID: ${VITE_APP_ID:-}
        VITE_MEASUREMENT_ID: ${VITE_MEASUREMENT_ID:-}
        VITE_VAPID_KEY: ${VITE_VAPID_KEY:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:80"
      - "127.0.0.1:3009:81"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/srv/media:ro
    depends_on:
      backend:
        condition: service_healthy

secrets:
  firebase_admin:
    file: ${FIREBASE_CREDENTIALS_FILE:-./backend-resenha/firebase-credentials.json}

volumes:
  postgres_data:
  redis_data:
  media_data:
