map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name 4000.michalski.app;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # This listener is reachable only through the local HTTPS Cloudflare tunnel.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;

    location /api/ { proxy_pass http://backend:8000; }
    location /admin/ { proxy_pass http://backend:8000; }
    location /static/ { proxy_pass http://backend:8000; }
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /media/ { alias /srv/media/; }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 81;
    server_name 3009.michalski.app;
    client_max_body_size 20m;
    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location /media/ { alias /srv/media/; }
}
