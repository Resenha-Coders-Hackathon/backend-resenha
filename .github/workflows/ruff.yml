name: Django & Ruff CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # .env is not committed; Django refuses to start without a key
      SECRET_KEY: ci-only-not-a-real-secret
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Setup PDM
      uses: pdm-project/setup-pdm@v4
      with:
        python-version: "3.14"
        enable-pep582: true

    - name: Install dependencies
      run: |
        pdm install -G lint

    - name: Run Django System Checks
      run: |
        pdm run python manage.py check

    - name: Run tests
      run: |
        pdm run python manage.py test

    - name: Check deployment automation
      run: |
        bash -n deployment/update.sh
        python deployment/tests/test_update.py

    - name: Analysing the code with ruff
      run: |
        pdm run ruff check
